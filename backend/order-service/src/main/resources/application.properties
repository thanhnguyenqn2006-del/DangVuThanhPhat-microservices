spring.application.name=order-service
server.port=8082

# Cấu hình kết nối SQL Server (Lab 02 - Trang 7 & 8)
# Chú ý: Kết nối tới SQL Server LocalDB trên máy
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=MSSQLLocalDB;databaseName=order_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${SQLSERVER_PASSWORD:YourStrongPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate ddl-auto để tự động tạo bảng từ Entity (Lab 02 - Trang 7)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
